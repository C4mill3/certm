[package]
name = "certm"
version = "0.1.2"
authors = ["C4mill3"]
edition = "2024"    
description = "This is a tui for managing x509 certificate using openssl and ratatui."
readme = "README.md"
repository = "https://github.com/C4mill3/certm"
license = "GPL-3.0-only"
categories = ["config"]
keywords = ["x509", "certificate", "ca", "manager", "tui"]
rust-version = "1.91.0"


[dependencies]
bincode = "2.0.1"
aes = "0.7.4"
block-modes = "0.8.1"
sha2 = "0.10.9"
shellexpand = "3.1.1"
openssl = "0.10.74"
rand = "0.9.2"
ratatui = {version = "0.29.0", features = ["unstable-widget-ref",]}
crossterm = "0.29.0"
